<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedido confirmado — Arquivo 90</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .ty-wrap {
      max-width: 560px;
      margin: 0 auto;
      padding: 9rem 1.5rem 6rem;
    }

    .ty-badge {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0.35rem 0.9rem;
      border-radius: 99px;
      margin-bottom: 1.5rem;
    }
    .ty-badge--approved { background: #14532d; color: #4ade80; }
    .ty-badge--pending  { background: #422006; color: #fb923c; }

    .ty-title {
      font-size: clamp(1.8rem, 5vw, 2.4rem);
      font-weight: 700;
      letter-spacing: 0.04em;
      margin: 0 0 0.75rem;
    }

    .ty-sub {
      color: var(--ink-mid);
      font-size: 0.95rem;
      line-height: 1.6;
      margin: 0 0 2.5rem;
    }

    .ty-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 1rem;
    }

    .ty-card__label {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-mid);
      margin: 0 0 0.9rem;
    }

    .ty-item {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 0.65rem 0;
      border-bottom: 1px solid var(--border);
      gap: 1rem;
    }
    .ty-item:last-child { border-bottom: none; padding-bottom: 0; }

    .ty-item__name  { font-size: 0.9rem; margin: 0 0 0.2rem; }
    .ty-item__meta  { font-size: 0.78rem; color: var(--ink-mid); margin: 0; }
    .ty-item__price { font-size: 0.9rem; white-space: nowrap; flex-shrink: 0; }

    .ty-totals { margin-top: 1rem; }
    .ty-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.88rem;
      color: var(--ink-mid);
      padding: 0.3rem 0;
    }
    .ty-row--total {
      font-size: 1rem;
      font-weight: 700;
      color: var(--ink);
      padding-top: 0.75rem;
      margin-top: 0.5rem;
      border-top: 1px solid var(--border);
    }
    .ty-row--free { color: var(--success, #4ade80); }

    .ty-address {
      font-size: 0.88rem;
      color: var(--ink-mid);
      line-height: 1.7;
      margin: 0;
    }

    .ty-actions {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-top: 2rem;
    }

    .ty-pending-box {
      background: #1a1200;
      border: 1px solid #4a3500;
      border-radius: 8px;
      padding: 1.25rem 1.5rem;
      margin-bottom: 1.5rem;
    }
    .ty-pending-box p { margin: 0; font-size: 0.88rem; color: #d4a017; line-height: 1.6; }
    .ty-pending-box p + p { margin-top: 0.5rem; color: var(--ink-mid); }

    .ty-pix {
      border: 1px solid var(--border);
      padding: 2rem 1.5rem;
      margin-bottom: 1.5rem;
      text-align: center;
    }
    .ty-pix__label {
      font-family: var(--font-mono); font-size: 0.62rem; font-weight: 700;
      letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--ink-mid); margin: 0 0 1.5rem;
    }
    .ty-pix__qr {
      width: 200px; height: 200px; margin: 0 auto 1.75rem;
      background: #fff; padding: 10px; display: block;
    }
    .ty-pix__btn {
      display: inline-flex; align-items: center; gap: 0.5rem;
      font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.1em;
      text-transform: uppercase; padding: 0.85rem 1.75rem;
      border: 1px solid var(--ink); background: var(--ink); color: var(--bg);
      cursor: pointer; transition: opacity 0.15s; margin-bottom: 0.75rem;
    }
    .ty-pix__btn:hover { opacity: 0.85; }
    .ty-pix__btn--copied { background: #3a7c52; border-color: #3a7c52; }
    .ty-pix__hint {
      font-family: var(--font-mono); font-size: 0.65rem;
      letter-spacing: 0.06em; color: var(--ink-mid); margin: 0;
    }
    .ty-pix__expire {
      font-family: var(--font-mono); font-size: 0.62rem;
      color: var(--ink-mid); margin: 1rem 0 0; letter-spacing: 0.06em;
    }
  </style>
</head>
<body>
  <nav class="nav scrolled">
    <a href="/" class="nav__brand">A R Q U I V O &nbsp; 9 0</a>
  </nav>

  <div class="ty-wrap">
    <div id="content">
      <div class="spinner" style="margin:0 auto 2rem"></div>
      <p style="color:var(--ink-mid);text-align:center">Carregando pedido...</p>
    </div>
  </div>

  <script type="module">
    import { clearCart, fmt } from '/js/cart.js';

    const params  = new URLSearchParams(location.search);
    const orderId = params.get('order');
    const status  = params.get('status'); // 'pendente' para PIX/boleto aguardando
    const el      = document.getElementById('content');

    // Email stored by checkout for ownership verification
    const orderEmail = sessionStorage.getItem('a90_order_email') || '';

    function fmtAddress(a) {
      if (!a) return '';
      const line1 = [a.rua, a.numero, a.complemento].filter(Boolean).join(', ');
      const line2 = [a.bairro, a.cidade + (a.estado ? '/' + a.estado : '')].filter(Boolean).join(' · ');
      const line3 = 'CEP ' + (a.cep || '');
      return [line1, line2, line3].filter(Boolean).join('<br>');
    }

    function renderApproved(order) {
      clearCart();
      const items    = order.order_items || [];
      const hasFrete = order.shipping_cost > 0;
      const hasDesc  = order.discount_amount > 0;
      const addr     = order.shipping_address;

      const itemsHtml = items.map(i => `
        <div class="ty-item">
          <div>
            <p class="ty-item__name">${i.product_name}</p>
            <p class="ty-item__meta">${i.size}${i.color ? ' · ' + i.color : ''} · Qtd ${i.quantity}</p>
          </div>
          <span class="ty-item__price">${fmt(i.unit_price * i.quantity)}</span>
        </div>`).join('');

      const subtotal = items.reduce((s, i) => s + i.unit_price * i.quantity, 0);

      el.innerHTML = `
        <span class="ty-badge ty-badge--approved">Pedido confirmado</span>
        <h1 class="ty-title">Arquivo registrado.</h1>
        <p class="ty-sub">
          Pagamento aprovado. Você receberá a confirmação por email em <strong>${order.customer_email}</strong>.
          <br>Pedido <strong>#${order.id.slice(-8).toUpperCase()}</strong>
        </p>

        ${items.length ? `
        <div class="ty-card">
          <p class="ty-card__label">Itens do pedido</p>
          ${itemsHtml}
          <div class="ty-totals">
            <div class="ty-row"><span>Subtotal</span><span>${fmt(subtotal)}</span></div>
            ${hasFrete
              ? `<div class="ty-row"><span>Frete${order.shipping_service_name ? ' · ' + order.shipping_service_name : ''}</span><span>${fmt(order.shipping_cost)}</span></div>`
              : `<div class="ty-row ty-row--free"><span>Frete</span><span>Grátis</span></div>`}
            ${hasDesc ? `<div class="ty-row"><span>Desconto${order.coupon_code ? ' (' + order.coupon_code + ')' : ''}</span><span style="color:var(--success,#4ade80)">− ${fmt(order.discount_amount)}</span></div>` : ''}
            <div class="ty-row ty-row--total"><span>Total</span><span>${fmt(order.total)}</span></div>
          </div>
        </div>` : ''}

        ${addr ? `
        <div class="ty-card">
          <p class="ty-card__label">Endereço de entrega</p>
          <p class="ty-address">${fmtAddress(addr)}</p>
          ${order.carrier || order.shipping_service_name ? `<p class="ty-address" style="margin-top:0.75rem;color:var(--ink)">${[order.carrier, order.shipping_service_name].filter(Boolean).join(' · ')}${order.shipping_deadline ? ' · ' + order.shipping_deadline : ''}</p>` : ''}
        </div>` : ''}

        <div class="ty-actions">
          <a href="/" class="btn btn--primary">Ver mais produtos</a>
        </div>`;
    }

    function renderPending(order) {
      const addr    = order?.shipping_address;
      const pixData = (() => {
        try {
          const d = JSON.parse(sessionStorage.getItem('pix_data') || 'null');
          if (d?.order_id === orderId) { sessionStorage.removeItem('pix_data'); return d; }
        } catch {}
        return null;
      })();

      const pixBlock = pixData?.qr_code ? `
        <div class="ty-pix">
          <p class="ty-pix__label">Pague com PIX</p>
          ${pixData.qr_code_base64
            ? `<img class="ty-pix__qr" src="data:image/png;base64,${pixData.qr_code_base64}" alt="QR Code PIX">`
            : ''}
          <button class="ty-pix__btn" id="pix-copy-btn">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            <span id="pix-copy-label">Copiar código PIX</span>
          </button>
          <p class="ty-pix__hint">Ou escaneie o QR code com o app do seu banco</p>
          <p class="ty-pix__expire">O código expira em 30 minutos</p>
        </div>` : '';

      el.innerHTML = `
        <span class="ty-badge ty-badge--pending">Aguardando pagamento</span>
        <h1 class="ty-title">Quase lá.</h1>
        <p class="ty-sub">
          Recebemos seu pedido — só falta confirmar o pagamento.
          <br>Pedido <strong>#${(order?.id || orderId || '').slice(-8).toUpperCase()}</strong>
        </p>

        ${pixBlock || `
        <div class="ty-pending-box">
          <p>Seu pagamento está sendo processado pelo banco.</p>
          <p>Assim que confirmar, você receberá um email e o pedido será separado automaticamente.</p>
        </div>`}

        ${addr ? `
        <div class="ty-card">
          <p class="ty-card__label">Endereço de entrega</p>
          <p class="ty-address">${fmtAddress(addr)}</p>
        </div>` : ''}

        <div class="ty-actions">
          <a href="/" class="btn">Voltar à loja</a>
        </div>`;

      // PIX copy to clipboard
      if (pixData?.qr_code) {
        document.getElementById('pix-copy-btn')?.addEventListener('click', async () => {
          try {
            await navigator.clipboard.writeText(pixData.qr_code);
            const btn   = document.getElementById('pix-copy-btn');
            const label = document.getElementById('pix-copy-label');
            if (label) label.textContent = 'Código copiado!';
            if (btn)   btn.classList.add('ty-pix__btn--copied');
            setTimeout(() => {
              if (label) label.textContent = 'Copiar código PIX';
              if (btn)   btn.classList.remove('ty-pix__btn--copied');
            }, 3000);
          } catch {}
        });
      }
    }

    function renderError() {
      el.innerHTML = `
        <h1 class="ty-title" style="margin-bottom:1rem">Obrigado!</h1>
        <p class="ty-sub">Seu pedido foi recebido. Em breve você receberá uma confirmação por email.</p>
        <div class="ty-actions">
          <a href="/" class="btn btn--primary">Ver mais produtos</a>
        </div>`;
    }

    // ── Main ─────────────────────────────────────────────────────────────────

    function orderUrl(id) {
      const q = orderEmail ? `?email=${encodeURIComponent(orderEmail)}` : '';
      return `/api/orders/${id}${q}`;
    }

    if (!orderId) { renderError(); }
    else if (status === 'pendente') {
      fetch(orderUrl(orderId))
        .then(r => r.ok ? r.json() : null)
        .then(data => renderPending(data?.order || null))
        .catch(() => renderPending(null));
    } else {
      fetch(orderUrl(orderId))
        .then(r => r.ok ? r.json() : Promise.reject())
        .then(data => renderApproved(data.order))
        .catch(() => {
          clearCart();
          renderError();
        });
    }
  </script>
</body>
</html>
