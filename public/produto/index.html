<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arquivo 90</title>
  <link rel="icon" href="/img/favicon.ico">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Header -->
  <header class="header scrolled" id="header">
    <div class="header__main">
      <button class="hamburger-btn" id="hamburger-btn" aria-label="Abrir menu">
        <span></span><span></span><span></span>
      </button>
      <a href="/" class="header__logo" aria-label="Arquivo 90 — início">
        <img src="/img/logo.png" alt="Arquivo 90"
             onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
        <span class="header__logo-text" style="display:none">ARQUIVO 90</span>
      </a>
      <div class="header__search">
        <input type="search" class="search-input" id="search-input" placeholder="Pesquisar produtos..." autocomplete="off">
        <button class="search-btn" aria-label="Pesquisar">⌕</button>
      </div>
      <div class="header__actions">
        <button class="cart-btn" id="cart-toggle" aria-label="Abrir carrinho">
          <svg class="cart-btn__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
          <span class="cart-btn__label">Carrinho</span>
          <span class="cart-count" id="cart-count">0</span>
        </button>
      </div>
    </div>
    <nav class="header__nav" id="main-nav">
      <a href="/">Início</a>
      <div class="nav-dropdown-wrap" id="nav-produtos" style="display:none">
        <button class="nav-dropdown-trigger">
          Produtos
          <svg width="9" height="5" viewBox="0 0 9 5" fill="none"><path stroke="currentColor" stroke-width="1.2" d="M1 1l3.5 3L8 1"/></svg>
        </button>
        <div class="nav-dropdown-menu" id="nav-produtos-menu"></div>
      </div>
      <div class="nav-dropdown-wrap" id="nav-esportes" style="display:none">
        <button class="nav-dropdown-trigger">
          Esportes
          <svg width="9" height="5" viewBox="0 0 9 5" fill="none"><path stroke="currentColor" stroke-width="1.2" d="M1 1l3.5 3L8 1"/></svg>
        </button>
        <div class="nav-dropdown-menu" id="nav-esportes-menu"></div>
      </div>
      <div class="nav-dropdown-wrap" id="nav-categorias" style="display:none">
        <button class="nav-dropdown-trigger">
          Categorias
          <svg width="9" height="5" viewBox="0 0 9 5" fill="none"><path stroke="currentColor" stroke-width="1.2" d="M1 1l3.5 3L8 1"/></svg>
        </button>
        <div class="nav-dropdown-menu" id="nav-categorias-menu"></div>
      </div>
      <div class="nav-dropdown-wrap" id="nav-times" style="display:none">
        <button class="nav-dropdown-trigger">
          Times
          <svg width="9" height="5" viewBox="0 0 9 5" fill="none"><path stroke="currentColor" stroke-width="1.2" d="M1 1l3.5 3L8 1"/></svg>
        </button>
        <div class="nav-dropdown-menu" id="nav-times-menu"></div>
      </div>
      <a href="/sobre">Sobre</a>
    </nav>
  </header>

  <!-- Product layout -->
  <div class="container">
    <div class="product-layout" id="product-layout">
      <div style="grid-column:1/-1;padding:4rem 0;text-align:center">
        <span class="spinner"></span>
      </div>
    </div>
  </div>

  <footer class="footer" style="margin-top:5rem">
    <div class="container footer__inner">
      <div>
        <p class="footer__brand">Arquivo 90</p>
        <p class="footer__sub" style="margin-top:0.25rem">Memória em Tecido</p>
      </div>
      <p class="footer__sub">© 2026 &mdash; São Paulo</p>
      <nav class="footer__links">
        <a href="https://instagram.com/arquivo90.oficial" target="_blank" rel="noopener noreferrer">Instagram</a>
      </nav>
    </div>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module">
    import { initCartButton, addItem, openCart, fmt } from '/js/cart.js';
    import { initNav, buildNavDrawer } from '/js/nav.js';

    initCartButton('#cart-toggle');
    initNav('/produto');

    function buildNavDropdowns(products) {
      const tipos    = [...new Set(products.map(p => p.tipo).filter(Boolean))].sort();
      const subcats  = [...new Set(products.map(p => p.subcategoria).filter(Boolean))].sort();
      const esportes = [...new Set(products.map(p => p.esporte).filter(Boolean))].sort();
      const times    = [...new Set(products.map(p => p.time_ref).filter(Boolean))].sort();
      const fill = (menuId, wrapId, items, param) => {
        if (!items.length) return;
        document.getElementById(menuId).innerHTML = items
          .map(v => `<a href="/produtos?${param}=${encodeURIComponent(v)}">${v}</a>`).join('');
        document.getElementById(wrapId).style.display = '';
      };
      fill('nav-produtos-menu',   'nav-produtos',   tipos,    'tipo');
      fill('nav-esportes-menu',   'nav-esportes',   esportes, 'esporte');
      fill('nav-categorias-menu', 'nav-categorias', subcats,  'subcategoria');
      fill('nav-times-menu',      'nav-times',      times,    'time_ref');
    }

    fetch('/api/products').then(r => r.json()).then(({ products }) => {
      buildNavDropdowns(products ?? []);
      buildNavDrawer(products ?? [], '/produto');
    }).catch(() => {});

    document.getElementById('search-input')?.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        const q = e.target.value.trim();
        if (q) location.href = `/produtos?q=${encodeURIComponent(q)}`;
      }
    });

    // ── Toast ──
    let _toastTimer;
    function toast(msg, type = '') {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.className = `toast ${type} show`;
      clearTimeout(_toastTimer);
      _toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
    }

    // ── Gallery ──
    let _allImages    = [];  // all images for the product
    let _activeImages = [];  // current subset (global or per-color)

    function setMainImage(idx) {
      const main = document.getElementById('gallery-main');
      if (!main || !_activeImages[idx]) return;
      main.style.opacity = '0';
      setTimeout(() => {
        main.src = _activeImages[idx].url;
        main.style.opacity = '1';
      }, 150);
      document.querySelectorAll('.gallery__thumb').forEach((th, i) => {
        th.classList.toggle('active', i === idx);
      });
    }

    function imagesForColor(color) {
      const specific = _allImages.filter(img => img.color === color);
      if (specific.length > 0) return specific;
      const global   = _allImages.filter(img => !img.color);
      return global.length > 0 ? global : _allImages;
    }

    function colorThumb(color) {
      const specific = _allImages.filter(img => img.color === color);
      const front    = specific.find(i => i.type === 'front') || specific[0];
      if (front) return front.url;
      const fallback = _allImages.find(i => i.type === 'front' && !i.color) || _allImages.find(i => !i.color);
      return fallback?.url || '';
    }

    function updateGallery(images) {
      _activeImages = [...images].sort((a, b) => (a.display_order ?? 99) - (b.display_order ?? 99));
      const main     = document.getElementById('gallery-main');
      const thumbsEl = document.querySelector('.gallery__thumbs');
      if (!images.length) return;

      const sorted = [...images].sort((a, b) => (a.display_order ?? 99) - (b.display_order ?? 99));
      const front = sorted[0];
      if (main) {
        main.style.opacity = '0';
        setTimeout(() => { main.src = front.url; main.style.opacity = '1'; }, 150);
      }

      if (!thumbsEl) return;
      if (images.length > 1) {
        thumbsEl.style.display = '';
        thumbsEl.innerHTML = images.map((img, i) =>
          `<img src="${img.url}" class="gallery__thumb${i === 0 ? ' active' : ''}" data-idx="${i}" alt="" loading="lazy">`
        ).join('');
        thumbsEl.querySelectorAll('.gallery__thumb').forEach((th, i) => {
          th.addEventListener('click', () => setMainImage(i));
        });
      } else {
        thumbsEl.style.display = 'none';
      }
    }

    // ── Load product ──
    async function load() {
      const layout = document.getElementById('product-layout');
      const slug   = location.pathname.split('/').filter(Boolean).pop();

      let result;
      try {
        const res = await fetch(`/api/products/${slug}`);
        if (res.status === 404) throw new Error('404');
        if (!res.ok) throw new Error(`${res.status}`);
        result = await res.json();
      } catch {
        layout.innerHTML = `
          <div style="grid-column:1/-1;padding:6rem 0;text-align:center">
            <p style="font-family:var(--font-sc);letter-spacing:0.08em;color:var(--ink-mid)">Produto não encontrado.</p>
            <a href="/" style="font-family:var(--font-mono);font-size:0.68rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--ink-mid);margin-top:1.5rem;display:inline-block;text-decoration:underline">← Voltar para a loja</a>
          </div>`;
        return;
      }

      const p = result.product;
      document.title = `${p.name} — Arquivo 90`;

      _allImages   = p.product_images ?? [];
      _activeImages = _allImages;
      const sizes     = p.product_sizes ?? [];
      const hasColors = sizes.some(s => s.color);

      // Initial gallery: global images (no color), fallback to all
      const initImages = _allImages.filter(i => !i.color);
      _activeImages    = initImages.length > 0 ? initImages : _allImages;
      _activeImages    = [..._activeImages].sort((a, b) => (a.display_order ?? 99) - (b.display_order ?? 99));
      const cover      = _activeImages[0] || null;

      const thumbsHtml = _activeImages.map((img, i) =>
        `<img src="${img.url}" class="gallery__thumb${i === 0 ? ' active' : ''}" data-idx="${i}" alt="" loading="lazy">`
      ).join('');

      const allAvail = sizes.filter(s => s.available > 0);
      const isEsgotado = allAvail.length === 0;

      const colorList = hasColors
        ? [...new Map(sizes.filter(s => s.color).map(s => [s.color, s.color])).values()]
        : [];

      const colorSelectorHtml = hasColors ? `
        <div style="margin-bottom:1.5rem">
          <p class="info__section-label">Cor</p>
          <div class="color-selector" id="color-selector">
            ${colorList.map(c => {
              const thumb = colorThumb(c);
              return `<button class="color-btn" data-color="${c}">
                ${thumb
                  ? `<img src="${thumb}" class="color-btn__img" alt="${c}" loading="lazy">`
                  : `<div class="color-btn__swatch"></div>`}
                <span class="color-btn__label">${c}</span>
              </button>`;
            }).join('')}
          </div>
        </div>
        <div id="size-wrap" style="margin-bottom:2rem;display:none">
          <p class="info__section-label">Tamanho</p>
          <div class="size-selector" id="size-selector"></div>
        </div>` : `
        <div style="margin-bottom:2rem">
          <p class="info__section-label">Tamanho</p>
          <div class="size-selector" id="size-selector">
            ${sizes.map(s => `<button class="size-btn" data-size="${s.size}" ${s.available === 0 ? 'disabled' : ''}>${s.size}</button>`).join('')}
          </div>
          ${isEsgotado ? '<p style="font-family:var(--font-mono);font-size:0.65rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--error);margin-top:0.75rem">Esgotado</p>' : ''}
        </div>`;

      layout.innerHTML = `
        <div class="gallery">
          <img id="gallery-main"
               src="${cover?.url || ''}"
               alt="${p.name}"
               class="gallery__main"
               style="transition:opacity 0.2s">
          <div class="gallery__thumbs"${_activeImages.length <= 1 ? ' style="display:none"' : ''}>${thumbsHtml}</div>
        </div>

        <div class="info">
          <p class="info__eyebrow">Arquivo 90</p>
          <h1 class="info__title">${p.name}</h1>
          ${p.subtitle ? `<p class="info__sub">${p.subtitle}</p>` : ''}
          <p class="info__price">${fmt(p.price)}</p>

          ${sizes.length ? colorSelectorHtml : ''}

          <button class="btn btn--primary btn--full" id="btn-buy" ${isEsgotado ? 'disabled' : ''}>
            ${isEsgotado ? 'Esgotado' : 'Adicionar ao carrinho'}
          </button>

          ${p.description ? `<hr class="divider"><div class="product-description" id="product-description"></div>` : ''}

          <hr class="divider">
          <div class="info__specs">
            <span>Algodão 210g</span>
            <span>DTF 300dpi</span>
            <span>Fio 20.1 penteado</span>
            <span>Costura dupla</span>
          </div>
        </div>`;

      // Inject description as HTML (safe: admin-authored content)
      if (p.description) {
        document.getElementById('product-description').innerHTML = p.description;
      }

      // ── Gallery thumbs ──
      document.querySelectorAll('.gallery__thumb').forEach((th, i) => {
        th.addEventListener('click', () => setMainImage(i));
      });

      // ── Variant state ──
      let selectedColor = null;
      let selectedSize  = null;

      function sizesForColor(color) {
        return sizes.filter(s => s.color === color);
      }

      function renderSizes(colorSizes) {
        const sel = document.getElementById('size-selector');
        if (!sel) return;
        sel.innerHTML = colorSizes.map(s =>
          `<button class="size-btn" data-size="${s.size}" ${s.available === 0 ? 'disabled' : ''}>${s.size}</button>`
        ).join('');
        sel.querySelectorAll('.size-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            sel.querySelectorAll('.size-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            selectedSize = btn.dataset.size;
          });
        });
        selectedSize = null;
      }

      // ── Color selection ──
      if (hasColors) {
        document.querySelectorAll('.color-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            selectedColor = btn.dataset.color;
            updateGallery(imagesForColor(selectedColor));
            renderSizes(sizesForColor(selectedColor));
            const wrap = document.getElementById('size-wrap');
            if (wrap) wrap.style.display = 'block';
          });
        });

        // Auto-select if only one color
        if (colorList.length === 1) {
          document.querySelector('.color-btn')?.click();
        }
      } else {
        document.querySelectorAll('.size-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            selectedSize = btn.dataset.size;
          });
        });
      }

      // ── Add to cart ──
      document.getElementById('btn-buy')?.addEventListener('click', () => {
        if (hasColors && !selectedColor) { toast('Selecione uma cor', 'error'); return; }
        if (!selectedSize) { toast('Selecione um tamanho', 'error'); return; }

        const coverForColor = selectedColor
          ? (imagesForColor(selectedColor).find(i => i.type === 'front') || imagesForColor(selectedColor)[0])
          : (_allImages.find(i => i.type === 'front') || _allImages[0]);

        addItem({
          product_id:   p.id,
          product_name: p.name,
          slug:         p.slug,
          size:         selectedSize,
          color:        hasColors ? selectedColor : null,
          quantity:     1,
          unit_price:   p.price,
          image:        coverForColor?.url || ''
        });

        toast('Adicionado ao carrinho', 'success');
        setTimeout(() => openCart(), 400);
      });
    }

    load();
  </script>
</body>
</html>
