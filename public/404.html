<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página não encontrada — Arquivo 90</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .e404 {
      max-width: 480px;
      margin: 0 auto;
      padding: 10rem 1.5rem 6rem;
      text-align: center;
    }
    .e404__code {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-faint);
      margin: 0 0 2rem;
    }
    .e404__title {
      font-size: clamp(1.8rem, 5vw, 2.4rem);
      font-weight: 700;
      letter-spacing: 0.04em;
      margin: 0 0 1rem;
    }
    .e404__sub {
      color: var(--ink-mid);
      font-size: 0.95rem;
      line-height: 1.6;
      margin: 0 0 2.5rem;
    }
    .e404__actions {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>
  <nav class="nav scrolled">
    <a href="/" class="nav__brand">A R Q U I V O &nbsp; 9 0</a>
  </nav>

  <div class="e404">
    <p class="e404__code">Erro 404</p>
    <h1 class="e404__title">Página não encontrada.</h1>
    <p class="e404__sub">O arquivo que você procura não está aqui — ou foi arquivado.<br>Mas o acervo continua de pé.</p>
    <div class="e404__actions">
      <a href="/" class="btn btn--primary">Ir para a loja</a>
      <a href="/produtos" class="btn">Ver produtos</a>
    </div>
  </div>
</body>
</html>
