<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout — Arquivo 90</title>
  <link rel="icon" href="/img/favicon.ico">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    /* ── Checkout nav ── */
    .checkout-nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: var(--bg); border-bottom: 1px solid var(--border); height: 58px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 2rem; }
    .checkout-nav__back { display: flex; align-items: center; gap: 0.5rem; color: var(--ink-mid); font-family: var(--font-mono); font-size: 0.65rem; letter-spacing: 0.1em; text-decoration: none; transition: color 0.15s; }
    .checkout-nav__back:hover { color: var(--ink); }
    .checkout-nav__back svg { width: 14px; height: 14px; flex-shrink: 0; }
    .checkout-nav__brand { font-family: var(--font-sc); letter-spacing: 0.2em; font-size: 0.78rem; color: var(--ink); text-decoration: none; justify-self: center; }
    .checkout-nav__secure { display: flex; align-items: center; gap: 0.4rem; justify-content: flex-end; color: var(--ink-faint); font-family: var(--font-mono); font-size: 0.6rem; letter-spacing: 0.1em; }
    .checkout-nav__secure svg { width: 11px; height: 11px; flex-shrink: 0; }
    @media (max-width: 600px) { .checkout-nav__secure span { display: none; } }

    .checkout-layout { display: grid; grid-template-columns: 1fr 380px; gap: 4rem; padding-top: 6.5rem; padding-bottom: 5rem; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .form-grid .full { grid-column: 1 / -1; }
    .summary { position: sticky; top: 6.5rem; }
    .summary-item { display: flex; justify-content: space-between; align-items: flex-start; padding: 0.9rem 0; border-bottom: 1px solid var(--border); font-size: 0.95rem; gap: 0.75rem; }
    .summary-item:last-of-type { border-bottom: none; }
    .summary-item__img { width: 54px; height: 70px; object-fit: cover; background: var(--surface); flex-shrink: 0; display: block; }
    .summary-item__info { flex: 1; min-width: 0; }
    .summary-item__actions { display: flex; flex-direction: column; align-items: flex-end; gap: 0.3rem; flex-shrink: 0; }
    .summary-total { display: flex; justify-content: space-between; padding: 1.2rem 0 0; font-family: var(--font-sc); letter-spacing: 0.05em; }

    /* Coupon in sidebar */
    .summary-coupon { padding: 1rem 0; border-bottom: 1px solid var(--border); margin-bottom: 0; }
    .summary-coupon__row { display: flex; gap: 0.6rem; }
    .summary-coupon__input { font-family: var(--font-mono); font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase; flex: 1; padding: 0.65rem 0.8rem; border: 1px solid var(--border); background: transparent; color: var(--ink); outline: none; transition: border-color 0.15s; }
    .summary-coupon__input:focus { border-color: var(--ink); }
    .summary-coupon__input::placeholder { color: var(--ink-faint); }
    .summary-coupon__btn { font-family: var(--font-mono); font-size: 0.65rem; letter-spacing: 0.1em; text-transform: uppercase; padding: 0.65rem 0.9rem; border: 1px solid var(--border); background: transparent; color: var(--ink-mid); cursor: pointer; white-space: nowrap; flex-shrink: 0; transition: var(--trans); }
    .summary-coupon__btn:hover:not(:disabled) { border-color: var(--ink); color: var(--ink); }
    .summary-coupon__feedback { font-family: var(--font-mono); font-size: 0.65rem; letter-spacing: 0.06em; min-height: 1.2em; margin-top: 0.45rem; }
    @media (max-width: 900px) { .checkout-layout { grid-template-columns: 1fr; gap: 2rem; padding-top: 6rem; } .summary { position: static; } }

    /* ── Trust strip ── */
    .checkout-trust { display: flex; align-items: center; justify-content: center; gap: 1.5rem; margin-top: 1.25rem; padding-top: 1.25rem; border-top: 1px solid var(--border); flex-wrap: wrap; }
    .checkout-trust__item { display: flex; align-items: center; gap: 0.4rem; font-family: var(--font-mono); font-size: 0.6rem; letter-spacing: 0.08em; color: var(--ink-faint); }
    .checkout-trust__item svg { width: 13px; height: 13px; flex-shrink: 0; opacity: 0.5; }

    /* Shipping section */
    .shipping-section { margin-bottom: 2rem; }
    .shipping-loading { display: flex; align-items: center; gap: 0.75rem; color: var(--ink-mid); font-size: 0.82rem; font-family: var(--font-mono); letter-spacing: 0.08em; padding: 0.75rem 0; }
    .shipping-options { display: flex; flex-direction: column; gap: 0.6rem; margin-top: 0.75rem; }
    .shipping-option  { display: flex; align-items: center; gap: 1rem; padding: 0.9rem 1rem; border: 1px solid var(--border); cursor: pointer; transition: border-color 0.15s, background 0.15s; }
    .shipping-option:hover { border-color: var(--ink-mid); }
    .shipping-option.selected { border-color: var(--ink); background: var(--surface); }
    .shipping-option input[type=radio] { accent-color: var(--ink); flex-shrink: 0; width: 16px; height: 16px; }
    .shipping-option__info { flex: 1; }
    .shipping-option__name { font-family: var(--font-sc); font-size: 0.88rem; letter-spacing: 0.04em; }
    .shipping-option__company { font-family: var(--font-mono); font-size: 0.62rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-mid); }
    .shipping-option__deadline { font-family: var(--font-mono); font-size: 0.62rem; letter-spacing: 0.06em; color: var(--ink-mid); }
    .shipping-option__price { font-family: var(--font-sc); font-size: 0.92rem; letter-spacing: 0.04em; white-space: nowrap; }
    .shipping-note { font-family: var(--font-mono); font-size: 0.62rem; letter-spacing: 0.08em; color: var(--ink-faint); margin-top: 0.5rem; }
    .shipping-error { font-family: var(--font-mono); font-size: 0.65rem; letter-spacing: 0.08em; color: var(--ink-mid); padding: 0.6rem 0; }
  </style>
</head>
<body>
  <nav class="checkout-nav">
    <a href="/" class="checkout-nav__back" aria-label="Voltar à loja">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      <span>Continuar comprando</span>
    </a>
    <a href="/" class="checkout-nav__brand">A R Q U I V O &nbsp; 9 0</a>
    <div class="checkout-nav__secure">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      <span>COMPRA SEGURA</span>
    </div>
  </nav>

  <div class="container checkout-layout">
    <!-- Formulário -->
    <div>
      <h2 style="margin-bottom:2rem">Finalizar pedido</h2>

      <div id="error-banner" style="display:none;background:rgba(200,87,74,0.1);border:1px solid var(--error);color:var(--error);padding:0.75rem 1rem;border-radius:2px;margin-bottom:1.5rem;font-size:0.9rem;"></div>

      <form id="checkout-form" novalidate>
        <div style="margin-bottom:2rem">
          <h3 style="margin-bottom:1.2rem;font-size:1rem;letter-spacing:0.05em">Dados pessoais</h3>
          <div class="form-grid">
            <div class="field full">
              <label class="label">Nome completo *</label>
              <input class="input" name="name" type="text" autocomplete="name" required>
            </div>
            <div class="field">
              <label class="label">Email *</label>
              <input class="input" name="email" type="email" autocomplete="email" required>
            </div>
            <div class="field">
              <label class="label">WhatsApp</label>
              <input class="input" name="phone" type="tel" autocomplete="tel" placeholder="(11) 99999-9999">
            </div>
          </div>
        </div>

        <div style="margin-bottom:2rem">
          <h3 style="margin-bottom:1.2rem;font-size:1rem;letter-spacing:0.05em">Endereço de entrega</h3>
          <div class="form-grid">
            <div class="field">
              <label class="label">CEP *</label>
              <input class="input" name="cep" type="text" maxlength="9" placeholder="00000-000" required>
            </div>
            <div class="field" style="align-self:end">
              <button type="button" class="btn btn--ghost" id="btn-cep" style="padding:0.75rem 1.2rem;font-size:0.75rem">Buscar CEP</button>
            </div>
            <div class="field full">
              <label class="label">Rua *</label>
              <input class="input" name="rua" type="text" required>
            </div>
            <div class="field" style="max-width:140px">
              <label class="label">Número *</label>
              <input class="input" name="numero" type="text" required>
            </div>
            <div class="field">
              <label class="label">Complemento</label>
              <input class="input" name="complemento" type="text">
            </div>
            <div class="field">
              <label class="label">Bairro *</label>
              <input class="input" name="bairro" type="text" required>
            </div>
            <div class="field">
              <label class="label">Cidade *</label>
              <input class="input" name="cidade" type="text" required>
            </div>
            <div class="field" style="max-width:120px">
              <label class="label">Estado *</label>
              <input class="input" name="estado" type="text" maxlength="2" placeholder="SP" required>
            </div>
          </div>
        </div>

        <!-- Shipping options -->
        <div class="shipping-section" id="shipping-section" style="display:none">
          <h3 style="margin-bottom:0.75rem;font-size:1rem;letter-spacing:0.05em">Opções de entrega</h3>
          <div id="shipping-body"></div>
        </div>

        <button type="submit" class="btn btn--primary btn--full" id="btn-submit" style="display:flex;align-items:center;justify-content:center;gap:0.6rem;font-size:0.88rem;letter-spacing:0.1em;padding:1.1rem">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          IR PARA PAGAMENTO
        </button>

        <div class="checkout-trust">
          <div class="checkout-trust__item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            AMBIENTE SEGURO
          </div>
          <div class="checkout-trust__item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
            MERCADO PAGO
          </div>
          <div class="checkout-trust__item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
            DADOS CRIPTOGRAFADOS
          </div>
          <div class="checkout-trust__item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            ENTREGA EM ATÉ 10 DIAS
          </div>
        </div>
      </form>
    </div>

    <!-- Resumo -->
    <div class="summary">
      <h3 style="margin-bottom:1.25rem;font-size:1rem;letter-spacing:0.05em">Resumo do pedido</h3>
      <div id="summary-items">
        <p style="color:var(--ink-mid);font-size:0.9rem">Carrinho vazio.</p>
      </div>

      <!-- Cupom -->
      <div class="summary-coupon">
        <div class="summary-coupon__row">
          <input class="summary-coupon__input" id="coupon-input" type="text" placeholder="CUPOM DE DESCONTO"
            maxlength="50" autocomplete="off" spellcheck="false">
          <button type="button" class="summary-coupon__btn" id="btn-coupon">Aplicar</button>
        </div>
        <div class="summary-coupon__feedback" id="coupon-feedback"></div>
      </div>

      <div id="summary-totals"></div>
    </div>
  </div>

  <script type="module">
    import { getCart, clearCart, removeFromCart, calculateShipping, createPayment, validateCoupon, fmt, toast, setLoading } from '/js/api.js';

    const FLAT_RATE        = 2500;  // fallback quando ME não configurado
    const FREE_THRESHOLD   = 25000; // R$ 250 — frete grátis acima desse valor

    let cart             = getCart();
    let selectedShipping = null; // { id, name, company, price_cents, delivery_time }
    let shippingOptions  = null; // null = não calculado, [] = sem opções
    let isFallback       = false;
    let appliedCoupon    = null; // { code, type, value, discount_amount }

    function subtotal() {
      return cart.reduce((s, i) => s + i.unit_price * i.quantity, 0);
    }
    function isFreeShipping() {
      return subtotal() >= FREE_THRESHOLD;
    }

    // ── Summary ────────────────────────────────────────────────────────────────
    function shippingCost() {
      if (isFreeShipping())              return 0;
      if (shippingOptions === null)      return null;   // ainda não calculado
      if (isFallback)                    return FLAT_RATE;
      return selectedShipping?.price_cents ?? null;
    }

    function renderSummary() {
      const itemsEl  = document.getElementById('summary-items');
      const totalsEl = document.getElementById('summary-totals');
      if (!cart.length) {
        if (itemsEl)  itemsEl.innerHTML  = '<p style="color:var(--ink-mid);font-size:0.9rem">Carrinho vazio. <a href="/" style="color:var(--ink)">Ver produtos</a></p>';
        if (totalsEl) totalsEl.innerHTML = '';
        return;
      }

      // ── Items ──
      if (itemsEl) {
        itemsEl.innerHTML = cart.map(i => `
          <div class="summary-item">
            ${i.image
              ? `<img class="summary-item__img" src="${i.image}" alt="${i.product_name}">`
              : `<div class="summary-item__img"></div>`}
            <div class="summary-item__info">
              <div style="font-family:var(--font-sc);font-size:0.9rem;line-height:1.2">${i.product_name}</div>
              <div style="color:var(--ink-mid);font-size:0.78rem;margin-top:0.25rem;font-family:var(--font-mono);letter-spacing:0.04em">
                ${i.size}${i.color ? ' · ' + i.color : ''} · Qtd ${i.quantity}
              </div>
            </div>
            <div class="summary-item__actions">
              <span style="font-family:var(--font-sc);font-size:0.9rem">${fmt(i.unit_price * i.quantity)}</span>
              <button onclick="removeItem('${i.product_id}','${i.size}','${i.color||''}')" style="background:none;border:none;color:var(--ink-faint);cursor:pointer;font-size:0.75rem;font-family:var(--font-sc);letter-spacing:0.05em;padding:0">remover</button>
            </div>
          </div>`).join('');
      }

      // ── Totals ──
      if (totalsEl) {
        const sub      = subtotal();
        const freight  = shippingCost();
        const discount = appliedCoupon ? appliedCoupon.discount_amount : 0;
        const total    = freight !== null ? sub + freight - discount : sub - discount;
        const freteLabel = freight === null
          ? '<span style="color:var(--ink-faint)">a calcular</span>'
          : freight === 0
            ? '<span style="color:#3a7c52;font-weight:600">Grátis</span>'
            : fmt(freight);

        totalsEl.innerHTML = `
          <div style="padding-top:1rem">
            <div style="display:flex;justify-content:space-between;font-size:0.85rem;color:var(--ink-mid);margin-bottom:0.5rem">
              <span>Subtotal</span><span>${fmt(sub)}</span>
            </div>
            ${discount > 0 ? `
            <div style="display:flex;justify-content:space-between;font-size:0.85rem;color:#3a7c52;margin-bottom:0.5rem">
              <span>Desconto (${appliedCoupon.code})</span><span>− ${fmt(discount)}</span>
            </div>` : ''}
            <div style="display:flex;justify-content:space-between;font-size:0.85rem;color:var(--ink-mid);margin-bottom:0.8rem">
              <span>Frete</span><span>${freteLabel}</span>
            </div>
            ${freight !== null
              ? `<div class="summary-total"><span>Total</span><span>${fmt(Math.max(0, total))}</span></div>`
              : `<div class="summary-total" style="opacity:0.4"><span>Total</span><span>—</span></div>`}
          </div>`;
      }
    }

    window.removeItem = (product_id, size, color) => {
      cart = removeFromCart(product_id, size, color || null);
      renderSummary();
    };

    renderSummary();
    // Mostrar frete grátis imediatamente se carrinho já ultrapassar threshold
    if (isFreeShipping()) updateFreeShippingBanner();

    // ── Shipping quote ─────────────────────────────────────────────────────────
    function deadlineText(opt) {
      if (opt.delivery_min && opt.delivery_max && opt.delivery_min !== opt.delivery_max)
        return `${opt.delivery_min}–${opt.delivery_max} dias úteis`;
      const days = opt.delivery_time ?? opt.delivery_min ?? opt.delivery_max;
      return days ? `${days} dia${days === 1 ? '' : 's'} úteis` : '';
    }

    // Mostrar banner de frete grátis se aplicável
    function updateFreeShippingBanner() {
      const section = document.getElementById('shipping-section');
      const body    = document.getElementById('shipping-body');
      if (isFreeShipping()) {
        section.style.display = 'block';
        body.innerHTML = `<p style="font-family:var(--font-sc);font-size:0.88rem;letter-spacing:0.04em;color:#3a7c52;padding:0.6rem 0">Frete grátis para este pedido.</p>`;
        renderSummary();
        return true;
      }
      return false;
    }

    function renderShippingOptions(options, fallback) {
      if (updateFreeShippingBanner()) return; // frete grátis — não mostra opções

      const section = document.getElementById('shipping-section');
      const body    = document.getElementById('shipping-body');
      section.style.display = 'block';

      if (fallback || !options) {
        isFallback       = true;
        selectedShipping = null;
        body.innerHTML   = `<p class="shipping-note">Frete fixo: ${fmt(FLAT_RATE)} — calculado no despacho.</p>`;
        renderSummary();
        return;
      }

      if (!options.length) {
        body.innerHTML = `<p class="shipping-error">Nenhuma transportadora disponível para este CEP.</p>`;
        renderSummary();
        return;
      }

      isFallback       = false;
      selectedShipping = null;
      renderSummary();

      body.innerHTML = `
        <div class="shipping-options" id="shipping-options">
          ${options.map((opt, i) => `
            <label class="shipping-option" data-idx="${i}">
              <input type="radio" name="shipping" value="${i}">
              <div class="shipping-option__info">
                <div class="shipping-option__name">${opt.name}</div>
                <div class="shipping-option__company">${opt.company}</div>
                ${deadlineText(opt) ? `<div class="shipping-option__deadline">${deadlineText(opt)}</div>` : ''}
              </div>
              <div class="shipping-option__price">${fmt(opt.price_cents)}</div>
            </label>`).join('')}
        </div>
        <p class="shipping-note">Prazo contado a partir da postagem.</p>`;

      // Auto-select cheapest
      const first = document.querySelector('input[name=shipping]');
      if (first) { first.checked = true; selectShipping(options, 0); }

      document.querySelectorAll('input[name=shipping]').forEach((radio, idx) => {
        radio.addEventListener('change', () => selectShipping(options, idx));
      });
    }

    function selectShipping(options, idx) {
      selectedShipping = options[idx];
      document.querySelectorAll('.shipping-option').forEach((el, i) => {
        el.classList.toggle('selected', i === idx);
      });
      renderSummary();
    }

    let shippingDebounce;
    async function fetchShipping(cep) {
      clearTimeout(shippingDebounce);
      shippingDebounce = setTimeout(async () => {
        if (!cart.length) return;

        // Frete grátis: calcula silenciosamente para obter service_id para a etiqueta ME
        if (isFreeShipping()) {
          try {
            const meItems = cart.map(i => ({ product_id: i.product_id, quantity: i.quantity }));
            const result  = await calculateShipping({ cep, items: meItems });
            if (result.options?.length) {
              selectedShipping = result.options[0]; // mais barato — custo absorvido pelo lojista
            }
          } catch { /* falha silenciosa — pedido segue sem service_id */ }
          return; // não muda UI
        }

        const body    = document.getElementById('shipping-body');
        const section = document.getElementById('shipping-section');
        section.style.display = 'block';
        body.innerHTML = `<div class="shipping-loading"><span class="spinner"></span> Calculando frete...</div>`;

        try {
          const items = cart.map(i => ({ product_id: i.product_id, quantity: i.quantity }));
          const result = await calculateShipping({ cep, items });
          shippingOptions = result.options;
          renderShippingOptions(result.options, result.fallback);
        } catch {
          renderShippingOptions(null, true);
        }
      }, 400);
    }

    // ── CEP ───────────────────────────────────────────────────────────────────
    document.getElementById('btn-cep').addEventListener('click', async () => {
      const cep = document.querySelector('[name=cep]').value.replace(/\D/g,'');
      if (cep.length !== 8) { toast('CEP inválido', 'error'); return; }
      try {
        const r = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
        const d = await r.json();
        if (d.erro) { toast('CEP não encontrado', 'error'); return; }
        document.querySelector('[name=rua]').value    = d.logradouro || '';
        document.querySelector('[name=bairro]').value = d.bairro     || '';
        document.querySelector('[name=cidade]').value = d.localidade || '';
        document.querySelector('[name=estado]').value = d.uf         || '';
        await fetchShipping(cep);
      } catch { toast('Erro ao buscar CEP', 'error'); }
    });

    // Máscara + auto-busca frete quando CEP está completo
    document.querySelector('[name=cep]').addEventListener('input', e => {
      const raw = e.target.value.replace(/\D/g,'').slice(0,8);
      e.target.value = raw.length > 5 ? raw.slice(0,5) + '-' + raw.slice(5) : raw;
      if (raw.length === 8) fetchShipping(raw);
    });

    // ── Coupon ────────────────────────────────────────────────────────────────
    function setCouponFeedback(msg, color = 'var(--ink-mid)') {
      const el = document.getElementById('coupon-feedback');
      if (el) { el.textContent = msg; el.style.color = color; }
    }

    function removeCoupon() {
      appliedCoupon = null;
      const input = document.getElementById('coupon-input');
      if (input) { input.value = ''; input.disabled = false; }
      const btn = document.getElementById('btn-coupon');
      if (btn) { btn.textContent = 'Aplicar'; }
      setCouponFeedback('');
      renderSummary();
    }

    async function applyCoupon() {
      const input = document.getElementById('coupon-input');
      const btn   = document.getElementById('btn-coupon');
      const code  = (input?.value || '').trim().toUpperCase();

      if (!code) { setCouponFeedback('Informe o código do cupom'); return; }

      // If a coupon is already applied, act as "Remover"
      if (appliedCoupon) { removeCoupon(); return; }

      btn.disabled = true; btn.textContent = '...';
      setCouponFeedback('');

      try {
        const sub  = subtotal();
        const data = await validateCoupon({ code, subtotal: sub });
        appliedCoupon = { ...data.coupon, discount_amount: data.discount_amount };
        input.disabled = true;
        btn.disabled   = false;
        btn.textContent = 'Remover';
        const label = data.coupon.type === 'percentage'
          ? `${data.coupon.value}% de desconto`
          : `R$ ${(data.coupon.value / 100).toFixed(2).replace('.', ',')} de desconto`;
        setCouponFeedback(`✓ Cupom aplicado — ${label}`, '#3a7c52');
        renderSummary();
      } catch (err) {
        btn.disabled    = false;
        btn.textContent = 'Aplicar';
        setCouponFeedback(err.message, 'var(--error)');
      }
    }

    document.getElementById('btn-coupon')?.addEventListener('click', applyCoupon);
    document.getElementById('coupon-input')?.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); applyCoupon(); }
    });

    // ── Submit ────────────────────────────────────────────────────────────────
    document.getElementById('checkout-form').addEventListener('submit', async e => {
      e.preventDefault();
      if (!cart.length) { toast('Carrinho vazio', 'error'); return; }

      // Require shipping selection when options were loaded (skip if free shipping)
      if (!isFreeShipping() && !isFallback && shippingOptions?.length && !selectedShipping) {
        toast('Selecione uma opção de frete', 'error'); return;
      }

      const btn       = document.getElementById('btn-submit');
      const errBanner = document.getElementById('error-banner');
      errBanner.style.display = 'none';

      const f = e.target;
      const customer = {
        name:  f.name.value.trim(),
        email: f.email.value.trim(),
        phone: f.phone.value.trim() || null
      };
      const shippingAddress = {
        cep:         f.cep.value.replace(/\D/g,''),
        rua:         f.rua.value.trim(),
        numero:      f.numero.value.trim(),
        complemento: f.complemento.value.trim() || null,
        bairro:      f.bairro.value.trim(),
        cidade:      f.cidade.value.trim(),
        estado:      f.estado.value.trim().toUpperCase()
      };

      const items = cart.map(i => ({
        product_id: i.product_id, size: i.size, color: i.color || null, quantity: i.quantity
      }));

      setLoading(btn, true);
      try {
        const { init_point } = await createPayment({
          items, customer, shippingAddress,
          shippingService: selectedShipping,
          couponCode: appliedCoupon?.code || null
        });
        clearCart();
        window.location.href = init_point;
      } catch (err) {
        errBanner.textContent = err.message;
        errBanner.style.display = 'block';
        setLoading(btn, false);
      }
    });

    // Mostrar erro de URL se vier redirecionado pelo MP
    const params = new URLSearchParams(location.search);
    if (params.get('erro')) {
      document.getElementById('error-banner').textContent = 'Pagamento não aprovado. Tente novamente.';
      document.getElementById('error-banner').style.display = 'block';
    }
  </script>
</body>
</html>
